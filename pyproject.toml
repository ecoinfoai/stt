[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.2.0"
description = "Local lecture pipeline: yt-dlp fetch + faster-whisper transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper==1.2.1",
    "yt-dlp>=2025.1",
    "pyyaml>=6",
]

[project.scripts]
stt = "stt.cli:main"

[project.optional-dependencies]
# Linux GPU machines: `uv sync --extra cuda` installs NVIDIA runtime libs.
# On Windows, place cuBLAS/cuDNN DLLs manually instead (see INSTALL.md).
cuda = [
    "nvidia-cublas-cu12>=12",
    "nvidia-cudnn-cu12>=9,<10",
]
# Speaker diarization (stt transcribe --diarize). Pulls torch — ~5GB.
# Needs HF_TOKEN and access to three gated pyannote models; see README.
#
# Do NOT combine with the `cuda` extra. torch ships its own CUDA 13 stack,
# and nvidia-cudnn-cu12 installs over torch's libcudnn.so.9 in the shared
# nvidia/cudnn/lib directory — removing either one deletes the other's
# library file, leaving a venv that only a full rebuild can fix.
# ctranslate2 is a CUDA 12 build, so it needs cuBLAS 12 (a distinct
# soname from torch's libcublas.so.13) while sharing torch's cuDNN 9.
diarize = [
    "pyannote.audio>=3.1",
    "nvidia-cublas-cu12>=12",
]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
