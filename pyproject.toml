[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.2.0"
description = "Local lecture pipeline: yt-dlp fetch + faster-whisper transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper==1.2.1",
    "yt-dlp>=2025.1",
    "pyyaml>=6",
]

[project.scripts]
stt = "stt.cli:main"

[project.optional-dependencies]
# Linux GPU machines: `uv sync --extra cuda` installs NVIDIA runtime libs.
# On Windows, place cuBLAS/cuDNN DLLs manually instead (see INSTALL.md).
cuda = [
    "nvidia-cublas-cu12>=12",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]
